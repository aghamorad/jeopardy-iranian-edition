name: JeopardyIranianEdition
options:
  bundleIdPrefix: com.morad
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

targets:
  JeopardyIOS:
    type: application
    platform: iOS
    sources:
      # The same three files the Mac app builds. AppMain.swift is macOS-guarded
      # and iOSApp.swift is iOS-guarded, so exactly one @main survives per platform.
      - path: ../App
        excludes:
          - "Resources"
      - path: Assets.xcassets
      # The show itself, verbatim. A folder reference copies the whole tree into
      # the bundle byte for byte — `index.html`, `styles.css`, `app.js`, every
      # asset and the clue bank — so nothing is re-encoded on the way in.
      - path: ../Web
        type: folder
        buildPhase: resources
    info:
      path: JeopardyIOS/Info.plist
      properties:
        CFBundleDisplayName: Jeopardy
        # Both numbers come from `Web/update.js`, via `build_ipa.sh` — the same
        # source `build_release.sh` and the Android build read. The show's own
        # update check measures GitHub releases against that file, so a bundle
        # stamped with a number the check disagrees with would announce a release
        # the player already has.
        CFBundleShortVersionString: ${SHOW_VERSION}
        # The same build number the Mac shell carries for this release, so the two
        # apps never disagree about which one is newer. Sideloaders compare this
        # field to decide whether an .ipa is an update, and a number that does not
        # move forward gets refused as "not newer" rather than installed.
        CFBundleVersion: ${SHOW_BUILD}
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # The phone edition is composed for portrait. Do not rotate a player
        # into the cramped broadcast canvas when the handset tips sideways.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morad.jeopardy
        PRODUCT_NAME: Jeopardy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
