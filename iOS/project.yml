name: JeopardyIranianEdition
options:
  bundleIdPrefix: com.morad
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

targets:
  JeopardyIOS:
    type: application
    platform: iOS
    sources:
      # The same three files the Mac app builds. AppMain.swift is macOS-guarded
      # and iOSApp.swift is iOS-guarded, so exactly one @main survives per platform.
      - path: ../App
        excludes:
          - "Resources"
      - path: Assets.xcassets
      # The show itself, verbatim. A folder reference copies the whole tree into
      # the bundle byte for byte — `index.html`, `styles.css`, `app.js`, every
      # asset and the clue bank — so nothing is re-encoded on the way in.
      - path: ../Web
        type: folder
        buildPhase: resources
    info:
      path: JeopardyIOS/Info.plist
      properties:
        CFBundleDisplayName: Jeopardy
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # A 1672x941 broadcast canvas — portrait would letterbox it to a stamp.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morad.jeopardy
        PRODUCT_NAME: Jeopardy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
