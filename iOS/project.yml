name: JeopardyIranianEdition
options:
  bundleIdPrefix: com.morad
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  JeopardyPackage:
    path: ".."

targets:
  JeopardyIOS:
    type: application
    platform: iOS
    sources:
      # Same sources the Mac app builds. AppMain.swift is macOS-guarded and
      # iOSApp.swift is iOS-guarded, so exactly one @main survives per platform.
      - path: ../App
        excludes:
          - "Resources/AppIcon.icns"
          - "Resources/AppIcon.iconset"
          - "Resources/AppIcon.svg"
      # The clue bank lives outside App/, and QuestionBank reads it from
      # Bundle.main before it ever falls back to a filesystem path.
      # (persian_clues.json is already picked up from App/Resources.)
      - path: ../QuestionBank/verified_clues.json
      - path: Assets.xcassets
    dependencies:
      - package: JeopardyPackage
        product: JeopardyGameEngine
    info:
      path: JeopardyIOS/Info.plist
      properties:
        CFBundleDisplayName: Jeopardy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # A 1672x941 broadcast canvas — portrait would letterbox it to a stamp.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morad.jeopardy
        PRODUCT_NAME: Jeopardy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
