<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Jeopardy Iranian Edition to SideStore</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #07152c; box-sizing: border-box; display: flex; margin: 0; min-height: 100vh; padding: 24px; }
      main { margin: auto; max-width: 32rem; text-align: center; }
      h1 { font-size: clamp(2rem, 8vw, 3.4rem); line-height: .95; margin: 0 0 1.25rem; }
      p { color: #cbd8ee; font-size: 1.05rem; line-height: 1.55; }
      .add { background: #0a4d91; border-radius: .65rem; color: #fff; display: inline-block; font-size: 1.1rem; font-weight: 700; margin: .8rem 0; padding: .9rem 1.2rem; text-decoration: none; }
      .add:focus, .add:hover { background: #1265b7; }
      .source { color: #91c5ff; }
      small { color: #9cadc8; display: block; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>JEOPARDY!<br>Iranian Edition</h1>
      <p>Tap once to add the source to SideStore. Then install the game from its listing.</p>
      <a class="add" href="sidestore://source?url=https%3A%2F%2Fraw.githubusercontent.com%2Faghamorad%2Fjeopardy-iranian-edition%2Fmain%2Fsidestore.json">Add to SideStore</a>
      <p><a class="source" href="https://raw.githubusercontent.com/aghamorad/jeopardy-iranian-edition/main/sidestore.json">View the source JSON</a></p>
      <small>Requires SideStore to be installed on this device.</small>
    </main>
  </body>
</html>
