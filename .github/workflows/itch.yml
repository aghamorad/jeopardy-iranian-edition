name: Publish to itch.io

# Ships the same tree GitHub Pages serves: Web/ is the product, so the HTML5
# channel on itch and the Pages site are one build, never two.
#
# The push runs on GitHub's runner rather than on a laptop here so that
# publishing never depends on a tunnel being up. itch.io is reachable from Iran
# only while one is: measured 2026-09-15 with no tunnel, itch resolved to a
# private address (10.10.34.36) and Cloudflare's DoH endpoint timed out on the
# same query; re-measured with the tunnel up, it resolved to real Cloudflare
# addresses (104.26.8.198, 104.26.9.198, 172.67.69.99) and both curl and a
# browser reached it from here. The runner sidesteps that variability rather
# than tracking it.
#
# The butler download host is broth.itch.zone. It was broth.itch.ovh, which is
# dead: DNS resolution fails on GitHub's own runners, not just from Iran, which
# is how the first two runs of this workflow died in "Install butler". Every
# broth URL 307s to a short-lived signed object, so it must be fetched with
# `curl -L` in one shot rather than linked to.

on:
  push:
    branches: [main]
    paths:
      - "Web/**"
      - ".github/workflows/itch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch-io
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` below needs the tags, and the default depth is 1.
          fetch-depth: 0

      - name: Check the itch target is configured
        env:
          TARGET: ${{ vars.ITCH_TARGET }}
          API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$TARGET" ]]  || missing+=("repository variable ITCH_TARGET, as user/game")
          [[ -n "$API_KEY" ]] || missing+=("secret ITCH_API_KEY, from itch.io -> Settings -> API keys")
          if (( ${#missing[@]} )); then
            printf '::error::Publishing is not configured yet. Set: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Publishing Web/ to $TARGET:html"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Gate: a malformed bank or a broken handshake must not reach the store page.
      - name: Check the build before publishing it
        run: node Tools/check_web.js

      - name: Install butler
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/butler.zip" \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" version 2>&1 | head -1 || true

      - name: Push the show
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/butler/butler" push Web "$TARGET:html" \
            --userversion "$(git describe --tags --always)"
